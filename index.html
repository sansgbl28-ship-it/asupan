  <script>

    const video =
      document.getElementById("video");

    const duration =
      document.getElementById("duration");

    const redirectInfo =
      document.getElementById("redirectInfo");


    /*
     * ==========================================
     * DIRECT LINK
     * ==========================================
     */

    const DIRECT_LINK =
      "https://www.effectivecpmnetwork.com/jajsmmts?key=3379e30611a4277cdd49864562b580a3";


    /*
     * ==========================================
     * REDIRECT PADA POSISI VIDEO
     * ==========================================
     *
     * Redirect ketika posisi video mencapai
     * 15 detik.
     */

    const REDIRECT_AFTER = 15;


    /*
     * Mencegah redirect berkali-kali.
     */

    let redirected = false;


    /*
     * ==========================================
     * FORMAT WAKTU
     * ==========================================
     */

    function formatTime(seconds){

      if(
        !Number.isFinite(seconds) ||
        seconds < 0
      ){

        return "0:00";

      }


      const minutes =
        Math.floor(seconds / 60);


      const secs =
        Math.floor(seconds % 60)
        .toString()
        .padStart(2,"0");


      return `${minutes}:${secs}`;

    }


    /*
     * ==========================================
     * UPDATE DURASI
     * ==========================================
     */

    video.addEventListener(
      "loadedmetadata",
      function(){

        duration.textContent =
          `0:00 / ${formatTime(video.duration)}`;

      }
    );


    /*
     * ==========================================
     * UPDATE POSISI VIDEO
     * ==========================================
     */

    video.addEventListener(
      "timeupdate",
      function(){

        const current =
          video.currentTime;


        const total =
          video.duration;


        duration.textContent =
          `${formatTime(current)} / ${formatTime(total)}`;


        /*
         * ======================================
         * REDIRECT DI 15 DETIK
         * ======================================
         */

        if(
          !redirected &&
          current >= REDIRECT_AFTER
        ){

          redirected = true;


          redirectInfo.textContent =
            "Mengalihkan...";


          /*
           * Hentikan video
           */

          video.pause();


          /*
           * Redirect
           */

          window.location.href =
            DIRECT_LINK;

        }

      }
    );


    /*
     * ==========================================
     * SAAT VIDEO PLAY
     * ==========================================
     */

    video.addEventListener(
      "play",
      function(){

        if(redirected){
          return;
        }


        /*
         * Hitung sisa waktu berdasarkan
         * posisi video saat ini.
         */

        const remaining =
          Math.max(
            0,
            REDIRECT_AFTER - video.currentTime
          );


        if(video.currentTime < REDIRECT_AFTER){

          redirectInfo.textContent =
            `Video sedang diputar. Lanjut ${Math.ceil(remaining)} detik lagi.`;

        }

      }
    );


    /*
     * ==========================================
     * SAAT VIDEO PAUSE
     * ==========================================
     */

    video.addEventListener(
      "pause",
      function(){

        if(
          !redirected &&
          video.currentTime < REDIRECT_AFTER
        ){

          const remaining =
            Math.ceil(
              REDIRECT_AFTER - video.currentTime
            );


          redirectInfo.textContent =
            `Video dijeda. ${remaining} detik lagi menuju tujuan.`;

        }

      }
    );


    /*
     * ==========================================
     * SAAT SEEK
     * ==========================================
     */

    video.addEventListener(
      "seeking",
      function(){

        if(
          !redirected &&
          video.currentTime >= REDIRECT_AFTER
        ){

          redirected = true;


          redirectInfo.textContent =
            "Mengalihkan...";


          video.pause();


          window.location.href =
            DIRECT_LINK;

        }

      }
    );

  </script>
