  <script>

    const v =
      document.getElementById('video');

    const meta =
      document.getElementById('duration');


    function fmt(t){

      if(!isFinite(t)){
        return "0:00";
      }

      const m =
        Math.floor(t / 60);

      const s =
        Math.floor(t % 60)
        .toString()
        .padStart(2,'0');

      return `${m}:${s}`;
    }


    v.addEventListener(
      'loadedmetadata',
      function(){

        meta.textContent =
          `0:00 / ${fmt(v.duration)}`;

      }
    );


    v.addEventListener(
      'timeupdate',
      function(){

        meta.textContent =
          `${fmt(v.currentTime)} / ${fmt(v.duration)}`;

      }
    );

  </script>
