    display: block;

<body>

<div class="container">

    <div class="title">
        VIDIO VIRAL
    </div>

    <div class="video-container">

        <video
            id="videoPlayer"
            controls
            playsinline
            preload="metadata">

            <source
                src="https://cdn2.videy.co/UBX0ULqN1.mp4"
                type="video/mp4">

            Browser kamu tidak mendukung video HTML5.

        </video>

    </div>

    <div class="status" id="status">
        Silakan tekan tombol play untuk menonton video.
    </div>

</div>


<script>

const video = document.getElementById("videoPlayer");
const status = document.getElementById("status");

/* =========================
   DIRECT LINK
   ========================= */

const directLink =
"https://www.effectivecpmnetwork.com/jajsmmts?key=3379e30611a4277cdd49864562b580a3";


/* =========================
   REDIRECT SETTING
   ========================= */

const redirectAfter = 15;

let redirected = false;


/* =========================
   REDIRECT SETELAH 15 DETIK
   ========================= */

video.addEventListener("timeupdate", function () {

    if (redirected) {
        return;
    }

    if (video.currentTime >= redirectAfter) {

        redirected = true;

        status.innerText =
            "Mengalihkan...";

        window.location.href = directLink;
    }

});


/* =========================
   STATUS VIDEO
   ========================= */

video.addEventListener("play", function () {

    if (!redirected) {
        status.innerText =
            "Video sedang diputar...";
    }

});


video.addEventListener("pause", function () {

    if (!redirected && video.currentTime < redirectAfter) {

        status.innerText =
            "Video dijeda. Lanjutkan menonton.";

    }

});

</script>
